<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
    font-family: Arial;
    width:400px;
    margin:auto;
}

li{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

button{
    margin-left:5px;
}
    </style>
    
</head>
<body>
    <h1>todo list</h1>
    <input type="text" id="toInput" placeholder="enter task">
    <button id="addBtn">add</button>

    <ol id="todoList"></ol>
    <script>
      let input=document.querySelector("#toInput")
      let btn=document.querySelector("#addBtn")
      let todo=document.querySelector("#todoList")

      btn.addEventListener("click",()=>{
        if(input.value.trim()==="")alert("input required")
        let li=document.createElement("li")
        li.innerText=`${input.value}`
        todo.append(li)
        input.value=""
      })
      
        
    </script>
    
</body>
</html>
