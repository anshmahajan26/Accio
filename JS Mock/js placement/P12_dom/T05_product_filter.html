<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Filter</title>
</head>
<body>

    <h2>Product List</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>Description</th>
            </tr>
        </thead>

        <tbody id="product-list"></tbody>
    </table>

    <br>

    <form id="filter-form">

        <label>Min Price:</label>
        <input type="number" id="min-price">

        <br><br>

        <label>Max Price:</label>
        <input type="number" id="max-price">

        <br><br>

        <button type="submit">Filter</button>

    </form>

    <p id="no-products-found"></p>

    <script>

        const products = [
            {
                name: "Product 1",
                price: 20,
                description: "Description 1"
            },
            {
                name: "Product 2",
                price: 50,
                description: "Description 2"
            },
            {
                name: "Product 3",
                price: 30,
                description: "Description 3"
            }
        ];

        const productList = document.getElementById("product-list");
        const filterForm = document.getElementById("filter-form");
        const minPriceInput = document.getElementById("min-price");
        const maxPriceInput = document.getElementById("max-price");
        const noProductsFound = document.getElementById("no-products-found");

        // Display Products
        function displayProducts(productArray) {

            productList.innerHTML = "";

            if (productArray.length === 0) {
                noProductsFound.textContent = "No Products Found";
                return;
            }

            noProductsFound.textContent = "";

            productArray.forEach(function(product) {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${product.name}</td>
                    <td>${product.price}</td>
                    <td>${product.description}</td>
                `;

                productList.appendChild(row);

            });

        }

        // Display all products initially
        displayProducts(products);

        // Filter Products
        filterForm.addEventListener("submit", function(e) {

            e.preventDefault();

            const minPrice = Number(minPriceInput.value);
            const maxPrice = Number(maxPriceInput.value);

            const filteredProducts = products.filter(function(product) {

                return product.price >= minPrice &&
                       product.price <= maxPrice;

            });

            displayProducts(filteredProducts);

        });

    </script>

</body>
</html>
